<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiginixIT AI Chatbot</title>
    <meta name="description" content="Standalone AI chatbot widget and backend integration package for DiginixIT with Grok and Gemini support.">
    <meta property="og:title" content="DiginixIT AI Chatbot">
    <meta property="og:description" content="Standalone AI chatbot widget and backend integration package for DiginixIT with Grok and Gemini support.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fafafa;
            color: #171717;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #ffffff;
            border: 1px solid #dfdfdf;
            border-radius: 16px;
            padding: 36px 32px;
            max-width: 620px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .tag {
            background: #171717;
            color: #3ecf8e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            color: #707070;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            background: #171717;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #3ecf8e;
            color: #171717;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="tag">DiginixIT AI Chatbot</span>
        <h1>Interactive Widget Preview</h1>
        <p>
            Look at the <strong>bottom-right corner</strong> of your screen to see the floating bot launcher button, or click below to launch the popup window.
        </p>
        <button class="btn" onclick="if(window.DiginixChatbot) window.DiginixChatbot.open();">Launch Chatbot</button>
    </div>
    <script src="chatbot.js" defer></script>

</body>
</html>
